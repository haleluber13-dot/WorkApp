<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MotorLab — Virtual Engine &amp; Vehicle Build Lab</title>
<meta name="description" content="Take an engine apart bolt by bolt and put it back together. Build chassis, suspension, drivetrain, wiring and audio. Tune the ECU, fit turbos and superchargers, then run it on the dyno.">
<meta name="theme-color" content="#0a0c10">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/build/three.module.min.js",
    "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="16" cy="16" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M16 3v6M16 23v6M3 16h6M23 16h6M6.8 6.8l4.3 4.3M20.9 20.9l4.3 4.3M25.2 6.8l-4.3 4.3M11.1 20.9l-4.3 4.3"
            stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="brand__txt"><b>MotorLab</b><small>virtual build &amp; tuning bay</small></div>
  </div>

  <nav class="workspaces" id="workspaces" aria-label="Workspaces"></nav>

  <div class="topbar__right">
    <div class="rig" id="rigChip" title="Current project">
      <span class="rig__eng" id="rigEngine">—</span>
      <span class="rig__veh" id="rigVehicle">—</span>
    </div>
    <button class="iconbtn" id="btnHelp" title="Controls &amp; shortcuts">?</button>
    <button class="iconbtn" id="btnReset" title="Reset this project">⟲</button>
  </div>
</header>

<main class="stage">
  <section class="viewport" id="viewport">
    <canvas id="gl"></canvas>
    <div class="vp__labels" id="labels"></div>

    <div class="vp__hud vp__hud--tl">
      <div class="hudtitle" id="hudTitle">Loading…</div>
      <div class="hudsub" id="hudSub"></div>
    </div>

    <div class="vp__hud vp__hud--tr" id="gauges"></div>

    <div class="vp__tools">
      <button class="tool" data-tool="explode" title="Exploded view (X)">✥</button>
      <button class="tool" data-tool="cutaway" title="Cutaway section (C)">◐</button>
      <button class="tool" data-tool="ghost"   title="Show missing parts as ghosts (G)">◇</button>
      <button class="tool" data-tool="labels"  title="Pin every part label (L) — otherwise a part names itself when you touch it">🏷</button>
      <button class="tool" data-tool="wire"    title="Wireframe (W)">⊞</button>
      <button class="tool" data-tool="fit"     title="Frame the model (F)">⛶</button>
    </div>

    <div class="vp__slider" id="explodeWrap" hidden>
      <label for="explode">Explode</label>
      <input type="range" id="explode" min="0" max="100" value="0">
    </div>

    <div class="vp__crank" id="crankBar" hidden>
      <button class="crankbtn" id="btnCrank" title="Turn the engine over">▶ Crank</button>
      <label class="crankrpm">RPM <input type="range" id="rpmIdle" min="0" max="9000" step="50" value="0"><span id="rpmRead">0</span></label>
    </div>

    <div class="vp__empty" id="vpEmpty" hidden></div>
  </section>

  <aside class="panel" id="panel">
    <div class="panel__head">
      <h2 id="panelTitle">Panel</h2>
      <div class="panel__tabs" id="panelTabs"></div>
    </div>
    <div class="panel__body" id="panelBody"></div>
    <div class="panel__foot" id="panelFoot"></div>
  </aside>
</main>

<div class="statusbar">
  <div class="status__left"  id="statusLeft">Ready</div>
  <div class="status__mid"   id="statusMid"></div>
  <div class="status__right" id="statusRight"></div>
</div>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast"></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
