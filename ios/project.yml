# XcodeGen spec — generates WorkApp.xcodeproj from these sources.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open WorkApp.xcodeproj
#
# If you'd rather not install XcodeGen, see README.md for the manual route
# (create an empty iOS App project in Xcode and drag the WorkApp folder in).

name: WorkApp
options:
  bundleIdPrefix: com.workapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set your Apple Team ID, or pick it in Xcode
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WorkApp:
    type: application
    platform: iOS
    sources:
      - path: WorkApp
    info:
      path: WorkApp/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workapp.hafaka
        PRODUCT_NAME: WorkApp
        INFOPLIST_FILE: WorkApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
