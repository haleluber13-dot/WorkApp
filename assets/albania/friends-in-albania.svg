      <rect x="2" y="10" width="18" height="66" fill="#3b4a5e"/>
      <path d="M-20 76 h20 v8 h-24 z M2 76 h20 l4 8 h-24 z" fill="#5a4030"/>
      <path d="M-26 -58 h52 l6 72 h-64 z" fill="#d88aa6"/>
      <g fill="#f3e6de" opacity="0.9">
