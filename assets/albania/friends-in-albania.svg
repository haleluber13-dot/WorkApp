    <path d="M760 300 L800 352 L780 346 L764 362 L746 344 L724 350 Z"/>
    <path d="M520 330 L548 367 L530 362 L514 372 L498 360 Z"/>
    <path d="M1500 350 L1534 392 L1514 388 L1498 402 L1482 386 L1468 390 Z"/>
    <path d="M120 380 L146 410 L130 406 L116 416 L100 402 Z"/>
