<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4c8c"/>
      <stop offset="0.45" stop-color="#e98b5f"/>
      <stop offset="0.7" stop-color="#ffd39a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa3c9"/>
      <stop offset="1" stop-color="#1b5f86"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd6e8"/>
      <stop offset="1" stop-color="#3a9cc0"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7fa8"/>
      <stop offset="1" stop-color="#b79aa6"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e6a78"/>
      <stop offset="1" stop-color="#5f7f6a"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8a3c"/>
      <stop offset="1" stop-color="#2f5e27"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.5" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky + sun -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="420" r="170" fill="url(#sun)"/>
  <circle cx="1180" cy="420" r="62" fill="#fff1c4"/>

  <!-- Birds -->
  <g fill="none" stroke="#3a2f45" stroke-width="3" stroke-linecap="round">
    <path d="M420 190 q14 -12 28 0 q14 -12 28 0"/>
    <path d="M500 230 q10 -9 20 0 q10 -9 20 0"/>
    <path d="M360 250 q9 -8 18 0 q9 -8 18 0"/>
  </g>

  <!-- Far snowy peaks (Albanian Alps) -->
  <path d="M0 520 L120 380 L200 440 L330 270 L430 400 L520 330 L640 450 L760 300 L880 430 L1000 360 L1100 470 L1250 380 L1380 460 L1500 350 L1600 420 L1600 560 L0 560 Z" fill="url(#far)"/>
  <g fill="#f4f1f7">
    <path d="M330 270 L372 325 L352 318 L336 336 L318 316 L296 318 Z"/>
    <path d="M760 300 L800 352 L780 346 L764 362 L746 344 L724 350 Z"/>
    <path d="M520 330 L548 367 L530 362 L514 372 L498 360 Z"/>
    <path d="M1500 350 L1534 392 L1514 388 L1498 402 L1482 386 L1468 390 Z"/>
    <path d="M120 380 L146 410 L130 406 L116 416 L100 402 Z"/>
  </g>

  <!-- Mid mountains -->
  <path d="M0 600 L150 470 L260 540 L400 430 L540 560 L660 480 L780 580 L900 600 L900 640 L0 640 Z" fill="url(#mid)"/>

  <!-- Sea on the right -->
  <path d="M820 600 L1600 560 L1600 780 L900 780 Z" fill="url(#sea)"/>
  <g stroke="#fff3cf" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <line x1="1120" y1="600" x2="1240" y2="600"/>
    <line x1="1080" y1="630" x2="1270" y2="630"/>
    <line x1="1130" y1="665" x2="1230" y2="665"/>
    <line x1="1100" y1="700" x2="1260" y2="700"/>
  </g>
  <!-- Small sailboat -->
  <g transform="translate(1400 610)">
    <path d="M-30 20 L30 20 L20 32 L-20 32 Z" fill="#fdfdfd"/>
    <path d="M0 -30 L0 18 L26 18 Z" fill="#ffffff"/>
    <path d="M-2 -20 L-2 18 L-22 18 Z" fill="#e4492e"/>
  </g>
  <!-- Coastline cliffs -->
  <path d="M800 640 C870 600 900 610 960 640 C1020 670 980 720 1040 780 L800 780 Z" fill="#6c8a52"/>

  <!-- Green hills -->
  <path d="M0 640 C200 590 360 610 520 650 C680 690 820 650 1000 700 C1150 740 1350 720 1600 760 L1600 1000 L0 1000 Z" fill="url(#near)"/>

  <!-- River winding from mountains down toward the sea -->
  <path d="M470 560 C440 610 520 640 480 690 C430 750 560 780 640 800 C760 830 900 790 1000 780 L1040 800 C900 820 780 870 640 860 C520 850 360 800 420 700 C450 650 400 610 440 560 Z" fill="url(#river)"/>
  <g stroke="#e8fbff" stroke-width="3" stroke-linecap="round" opacity="0.7" fill="none">
    <path d="M470 700 q20 -8 40 0"/>
    <path d="M600 820 q25 -8 50 0"/>
    <path d="M800 825 q25 -8 50 0"/>
  </g>

  <!-- Pine trees -->
  <g fill="#23461f">
    <path d="M150 640 l-28 60 h56 z M150 610 l-22 48 h44 z"/>
    <path d="M210 650 l-24 54 h48 z M210 624 l-19 42 h38 z"/>
    <path d="M1300 740 l-26 58 h52 z M1300 712 l-20 46 h40 z"/>
    <path d="M1360 750 l-22 50 h44 z M1360 726 l-17 40 h34 z"/>
  </g>
  <g fill="#5a3b22">
    <rect x="146" y="700" width="8" height="14"/>
    <rect x="206" y="704" width="8" height="12"/>
    <rect x="1296" y="798" width="8" height="12"/>
    <rect x="1356" y="800" width="8" height="12"/>
  </g>

  <!-- Friends, sitting and standing on the hill -->
  <g id="friends" transform="translate(600 812) scale(1.1)">
    <!-- friend 1 -->
    <g transform="translate(0 40)">
      <circle cx="0" cy="-80" r="20" fill="#c98e62"/>
      <path d="M-20 -86 q20 -26 40 0 q-4 -16 -20 -18 q-16 2 -20 18z" fill="#2a1a12"/>
      <path d="M-24 -58 h48 l8 70 h-64 z" fill="#e4492e"/>
      <rect x="-22" y="12" width="18" height="60" fill="#27364f"/>
      <rect x="4" y="12" width="18" height="60" fill="#27364f"/>
      <path d="M24 -50 l30 -50" stroke="#c98e62" stroke-width="12" stroke-linecap="round"/>
    </g>
    <!-- friend 2 -->
    <g transform="translate(90 34)">
      <circle cx="0" cy="-82" r="20" fill="#a86b43"/>
      <path d="M-22 -84 q22 -34 44 0 v40 h-8 v-36 h-28 v36 h-8 z" fill="#1c120c"/>
      <path d="M-24 -60 h48 l12 78 h-72 z" fill="#f5c542"/>
      <rect x="-18" y="18" width="14" height="58" fill="#1f2a3a"/>
      <rect x="4" y="18" width="14" height="58" fill="#1f2a3a"/>
      <path d="M-24 -50 l-24 30" stroke="#a86b43" stroke-width="12" stroke-linecap="round"/>
      <path d="M24 -50 l24 30" stroke="#a86b43" stroke-width="12" stroke-linecap="round"/>
    </g>
    <!-- friend 3 -->
    <g transform="translate(180 44)">
      <circle cx="0" cy="-78" r="20" fill="#e2b08a"/>
      <path d="M-20 -84 q20 -24 40 0 z" fill="#6b3f1e"/>
      <path d="M-24 -56 h48 l6 68 h-60 z" fill="#2e8b6e"/>
      <rect x="-20" y="12" width="17" height="56" fill="#3a3a3a"/>
      <rect x="3" y="12" width="17" height="56" fill="#3a3a3a"/>
      <path d="M-24 -48 l-26 32" stroke="#e2b08a" stroke-width="12" stroke-linecap="round"/>
      <path d="M24 -48 l26 32" stroke="#e2b08a" stroke-width="12" stroke-linecap="round"/>
    </g>
    <!-- friend 4, holding the flag -->
    <g transform="translate(270 36)">
      <circle cx="0" cy="-82" r="20" fill="#8a5a38"/>
      <path d="M-22 -86 q22 -28 44 0 q-8 -8 -22 -8 q-14 0 -22 8z" fill="#111"/>
      <path d="M-24 -60 h48 l8 72 h-64 z" fill="#4a6fd1"/>
      <rect x="-20" y="12" width="17" height="62" fill="#2b2b33"/>
      <rect x="3" y="12" width="17" height="62" fill="#2b2b33"/>
      <path d="M-24 -52 l-26 34" stroke="#8a5a38" stroke-width="12" stroke-linecap="round"/>
      <path d="M24 -52 l22 -40" stroke="#8a5a38" stroke-width="12" stroke-linecap="round"/>
      <line x1="48" y1="-200" x2="48" y2="-80" stroke="#4a3322" stroke-width="5"/>
      <!-- Albanian flag: red with a black double-headed eagle (simplified) -->
      <rect x="50" y="-200" width="96" height="66" fill="#e41e20"/>
      <g fill="#111" transform="translate(98 -167)">
        <path d="M-4 -18 h8 v30 h-8 z"/>
        <path d="M-4 -12 l-26 -12 l6 10 l-12 -2 l10 10 l-10 2 l14 6 l-8 6 l26 -6 z"/>
        <path d="M4 -12 l26 -12 l-6 10 l12 -2 l-10 10 l10 2 l-14 6 l8 6 l-26 -6 z"/>
        <circle cx="-8" cy="-22" r="4"/><circle cx="8" cy="-22" r="4"/>
        <path d="M-4 12 l-6 10 h6 l4 -6 l4 6 h6 l-6 -10 z"/>
      </g>
    </g>
  </g>

  <!-- Foreground wild grass & weeds -->
  <g stroke="#2a5a1c" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M40 1000 q10 -80 -10 -140"/><path d="M60 1000 q0 -70 20 -120"/>
    <path d="M90 1000 q-6 -60 -30 -100"/><path d="M130 1000 q10 -90 40 -130"/>
    <path d="M300 1000 q-10 -70 -30 -110"/><path d="M330 1000 q6 -80 30 -120"/>
    <path d="M520 1000 q-8 -60 -24 -90"/><path d="M560 1000 q4 -70 24 -100"/>
    <path d="M1060 1000 q-10 -80 -34 -120"/><path d="M1090 1000 q6 -70 28 -110"/>
    <path d="M1460 1000 q-10 -90 -30 -140"/><path d="M1500 1000 q8 -80 30 -130"/>
    <path d="M1540 1000 q-4 -60 -20 -100"/><path d="M1580 1000 q4 -70 16 -110"/>
  </g>
  <g stroke="#3f7a27" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M20 1000 l-6 -60"/><path d="M110 1000 l8 -70"/><path d="M200 1000 l-4 -60"/>
    <path d="M400 1000 l6 -50"/><path d="M700 1000 l-6 -50"/><path d="M900 1000 l6 -60"/>
    <path d="M1200 1000 l-6 -60"/><path d="M1380 1000 l6 -70"/>
  </g>
  <!-- Wildflowers -->
  <g>
    <g fill="#e4492e"><circle cx="30" cy="860" r="8"/><circle cx="170" cy="870" r="8"/><circle cx="360" cy="880" r="8"/><circle cx="1118" cy="890" r="8"/><circle cx="1530" cy="870" r="8"/></g>
    <g fill="#f6d34a"><circle cx="80" cy="880" r="6"/><circle cx="270" cy="890" r="6"/><circle cx="584" cy="900" r="6"/><circle cx="1026" cy="880" r="6"/><circle cx="1600" cy="890" r="6"/><circle cx="1490" cy="860" r="6"/></g>
    <g fill="#fff"><circle cx="60" cy="920" r="5"/><circle cx="496" cy="910" r="5"/><circle cx="1210" cy="940" r="5"/><circle cx="1400" cy="930" r="5"/></g>
    <g fill="#b88ae8"><circle cx="130" cy="930" r="6"/><circle cx="700" cy="950" r="6"/><circle cx="906" cy="940" r="6"/><circle cx="1580" cy="930" r="6"/></g>
  </g>

  <text x="40" y="70" font-family="Georgia, serif" font-size="44" fill="#fff8e6" opacity="0.9">Shqipëri · Albania</text>
</svg>
