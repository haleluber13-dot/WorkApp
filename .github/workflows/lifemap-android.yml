name: Build LifeMap APK

on:
  push:
    branches: [main]
    paths: ["lifemap/**", "lifemap-android/**", ".github/workflows/lifemap-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifemap-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the APK
        id: apk
        run: |
          cp app/build/outputs/apk/release/app-release.apk LifeMap.apk
          echo "tag=lifemap-apk-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: LifeMap-apk
          path: lifemap-android/LifeMap.apk
      - name: Refresh the APK copies on main (direct links stay current)
        run: |
          cp LifeMap.apk ../lifemap/LifeMap.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LifeMap.apk ../lifemap/LifeMap.apk
          git diff --cached --quiet || (git commit -m "Refresh LifeMap.apk [skip ci]" && git push)
      - name: Publish as a GitHub Release (permanent download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: LifeMap APK ${{ steps.apk.outputs.tag }}
          body: "מפת החיים הגדולה — Android APK. Download LifeMap.apk, open it on the phone, allow installing from this source, done."
          files: lifemap-android/LifeMap.apk
