# Publishes the built app to GitHub Pages, which is what makes it installable
# on an iPhone: Safari can only "Add to Home Screen" from a real URL.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/work-time-pay-tracker-4mybeg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # No `environment: github-pages` block here on purpose. Declaring it makes the
  # job subject to that environment's protection rules, and on this repository
  # those refuse the job before it is given a runner: it fails in two seconds
  # with no steps and no logs. deploy-pages authenticates with the workflow's
  # OIDC token and does not need the declaration.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Where it landed
        run: echo "Published to ${{ steps.deployment.outputs.page_url }}"

